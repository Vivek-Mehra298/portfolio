<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#grad2)"/>
  
  <text x="400" y="60" font-size="32" font-weight="bold" text-anchor="middle" fill="#fff" font-family="sans-serif">
    CRM Dashboard
  </text>
  
  <!-- Cards -->
  <rect x="50" y="100" width="150" height="120" fill="#1a1a1a" stroke="#333" stroke-width="2" rx="8"/>
  <text x="125" y="130" font-size="24" font-weight="bold" text-anchor="middle" fill="#666">
    1,234
  </text>
  <text x="125" y="165" font-size="14" text-anchor="middle" fill="#888">
    Leads
  </text>
  
  <rect x="250" y="100" width="150" height="120" fill="#1a1a1a" stroke="#333" stroke-width="2" rx="8"/>
  <text x="325" y="130" font-size="24" font-weight="bold" text-anchor="middle" fill="#666">
    567
  </text>
  <text x="325" y="165" font-size="14" text-anchor="middle" fill="#888">
    Active
  </text>
  
  <rect x="450" y="100" width="150" height="120" fill="#1a1a1a" stroke="#333" stroke-width="2" rx="8"/>
  <text x="525" y="130" font-size="24" font-weight="bold" text-anchor="middle" fill="#666">
    89
  </text>
  <text x="525" y="165" font-size="14" text-anchor="middle" fill="#888">
    Converted
  </text>
  
  <rect x="650" y="100" width="100" height="120" fill="#1a1a1a" stroke="#333" stroke-width="2" rx="8"/>
  <text x="700" y="130" font-size="20" font-weight="bold" text-anchor="middle" fill="#666">
    92%
  </text>
  <text x="700" y="165" font-size="12" text-anchor="middle" fill="#888">
    Rate
  </text>
  
  <!-- Bar chart -->
  <rect x="100" y="280" width="30" height="80" fill="#333"/>
  <rect x="150" y="260" width="30" height="100" fill="#333"/>
  <rect x="200" y="240" width="30" height="120" fill="#333"/>
  <rect x="250" y="270" width="30" height="90" fill="#333"/>
  <rect x="300" y="250" width="30" height="110" fill="#333"/>
  
  <line x1="50" y1="360" x2="350" y2="360" stroke="#555" stroke-width="2"/>
</svg>