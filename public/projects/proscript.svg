<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#grad3)"/>
  
  <text x="400" y="80" font-size="48" font-weight="bold" text-anchor="middle" fill="#fff" font-family="sans-serif">
    ProScript
  </text>
  
  <text x="400" y="130" font-size="20" text-anchor="middle" fill="#999" font-family="sans-serif">
    AI-Powered Writing Assistant
  </text>
  
  <!-- Editor area -->
  <rect x="80" y="160" width="640" height="160" fill="#0f0f0f" stroke="#333" stroke-width="2" rx="8"/>
  
  <!-- Text lines -->
  <line x1="100" y1="185" x2="650" y2="185" stroke="#444" stroke-width="2"/>
  <line x1="100" y1="210" x2="680" y2="210" stroke="#444" stroke-width="2"/>
  <line x1="100" y1="235" x2="620" y2="235" stroke="#444" stroke-width="2"/>
  <line x1="100" y1="260" x2="660" y2="260" stroke="#444" stroke-width="2"/>
  <line x1="100" y1="285" x2="600" y2="285" stroke="#444" stroke-width="2"/>
  
  <!-- AI Button -->
  <rect x="600" y="340" width="100" height="40" fill="#2a2a2a" stroke="#444" stroke-width="2" rx="6"/>
  <text x="650" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    ✨ Write
  </text>
</svg>